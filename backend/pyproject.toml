[project]
name = "civicwatch-backend"
version = "0.1.0"
description = "CivicWatch ZW API — multi-council civic infrastructure reporting"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0.30,<2.2",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "geoalchemy2>=0.15",
  "redis>=5.0",
  "celery>=5.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "httpx>=0.27",
  "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
known-first-party = ["app"]
