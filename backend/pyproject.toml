[project]
name = "civicwatch-backend"
version = "0.1.0"
description = "CivicWatch ZW API — multi-council civic infrastructure reporting"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0.30,<2.2",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "geoalchemy2>=0.15",
  "redis>=5.0",
  "celery>=5.4",
  "argon2-cffi>=23.1",
  "email-validator>=2.1",
  "boto3>=1.34",
  "pillow>=11.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "httpx>=0.27",
  "ruff>=0.5",
  # Local S3 emulator for tests when no real S3-compatible service is configured.
  "moto[server]>=5",
  # Real SMTP server for email delivery tests.
  "aiosmtpd>=1.4",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
# Bundled SAMPLE council boundaries (python -m app.cli load-sample-boundaries).
"app.data" = ["*.geojson"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
# Migrations embed long SQL built only from module constants.
"alembic/versions/*" = ["E501", "S608"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
known-first-party = ["app"]
