# Local development stack for CivicWatch ZW.
# Usage: cp .env.example .env && docker compose up --build

name: civicwatch

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-civicwatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-civicwatch}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD:?Set WORKER_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      # Creates the unprivileged API role on first start of an empty volume.
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Private S3-compatible storage for report photos. Pinned: MinIO no longer
  # publishes new community images, but existing tags remain available.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    ports:
      # The browser fetches photos here through signed URLs.
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    entrypoint: ["/bin/sh", "/init.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:?Set STORAGE_ACCESS_KEY_ID in .env}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:?Set STORAGE_SECRET_ACCESS_KEY in .env}
    volumes:
      - ./docker/minio/init.sh:/init.sh:ro
    depends_on:
      minio:
        condition: service_healthy

  migrate:
    build:
      context: ./backend
      target: dev
    command: ["alembic", "upgrade", "head"]
    environment: &backend-env
      CIVICWATCH_ENVIRONMENT: development
      # The API runs as civicwatch_app (subject to Row-Level Security);
      # only Alembic uses the owner account.
      CIVICWATCH_DATABASE_URL: postgresql+psycopg://civicwatch_app:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB:-civicwatch}
      CIVICWATCH_MIGRATION_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-civicwatch}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-civicwatch}
      CIVICWATCH_REDIS_URL: redis://redis:6379/0
      CIVICWATCH_CORS_ORIGINS: http://localhost:3000
      # Local HTTP only. Staging/production refuse to start with insecure cookies.
      CIVICWATCH_SESSION_COOKIE_NAME: cw_session
      CIVICWATCH_SESSION_COOKIE_SECURE: "false"
      # The API talks to MinIO inside the Compose network but signs photo
      # URLs for the address the browser uses.
      CIVICWATCH_STORAGE_ENDPOINT_URL: http://minio:9000
      CIVICWATCH_STORAGE_PUBLIC_ENDPOINT_URL: http://localhost:9000
      CIVICWATCH_STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID}
      CIVICWATCH_STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY}
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ./backend
      target: dev
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment: *backend-env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend/app:/app/app
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live')"
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ./backend
      target: dev
    # --beat embeds the scheduler for local use; run a separate beat process in production.
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--beat", "--loglevel=INFO"]
    environment:
      <<: *backend-env
      # Only the worker reads every user's notifications, to email them.
      CIVICWATCH_WORKER_DATABASE_URL: postgresql+psycopg://civicwatch_worker:${WORKER_DB_PASSWORD}@db:5432/${POSTGRES_DB:-civicwatch}
      # Local mail goes to Mailpit; read it at http://localhost:8025.
      CIVICWATCH_SMTP_HOST: mailpit
      CIVICWATCH_SMTP_PORT: "1025"
      CIVICWATCH_SMTP_STARTTLS: "false"
      CIVICWATCH_EMAIL_FROM: CivicWatch ZW <notifications@civicwatch.local>
      CIVICWATCH_PUBLIC_WEB_URL: http://localhost:3000
    volumes:
      - ./backend/app:/app/app
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

  # Catches every email sent locally; nothing leaves your machine.
  mailpit:
    image: axllent/mailpit:v1.21.8
    ports:
      - "127.0.0.1:8025:8025"

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
  minio-data:
