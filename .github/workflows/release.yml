name: Release images

# Publishes the production images to GitHub Container Registry after CI
# passes on main, tagged with the commit SHA (and "latest").
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            context: backend
            target: runtime
          - name: web
            context: frontend
            target: runtime
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Public addresses are configured
        if: matrix.name == 'web'
        env:
          API: ${{ vars.PUBLIC_API_BASE_URL }}
          MEDIA: ${{ vars.PUBLIC_MEDIA_ORIGINS }}
          TILES: ${{ vars.PUBLIC_MAP_TILE_URL }}
        run: |
          for value in "$API" "$MEDIA" "$TILES"; do
            case "$value" in https://*) ;; *) echo "Set PUBLIC_API_BASE_URL, PUBLIC_MEDIA_ORIGINS and PUBLIC_MAP_TILE_URL (https) as repository variables"; exit 1;; esac
          done
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: image
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.name }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: true
          # The web image bakes in public addresses at build time; set these
          # repository variables before the first release.
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.PUBLIC_API_BASE_URL }}
            NEXT_PUBLIC_MEDIA_ORIGINS=${{ vars.PUBLIC_MEDIA_ORIGINS }}
            NEXT_PUBLIC_MAP_TILE_URL=${{ vars.PUBLIC_MAP_TILE_URL }}
            NEXT_PUBLIC_DEMO_MODE=${{ vars.PUBLIC_DEMO_MODE }}
          tags: |
            ${{ steps.image.outputs.ref }}:${{ github.event.workflow_run.head_sha }}
            ${{ steps.image.outputs.ref }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
