name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CIVICWATCH_ENVIRONMENT: test
  # The API and tests run as the unprivileged role so Row-Level Security applies.
  CIVICWATCH_DATABASE_URL: postgresql+psycopg://civicwatch_app:civicwatch_app@localhost:5432/civicwatch_test
  CIVICWATCH_MIGRATION_DATABASE_URL: postgresql+psycopg://civicwatch:civicwatch@localhost:5432/civicwatch_test
  CIVICWATCH_WORKER_DATABASE_URL: postgresql+psycopg://civicwatch_worker:civicwatch_worker@localhost:5432/civicwatch_test
  CIVICWATCH_REDIS_URL: redis://localhost:6379/0
  # Real S3-compatible storage (MinIO), so tests also prove that photos cannot
  # be fetched without a valid, unexpired signature.
  CIVICWATCH_STORAGE_ENDPOINT_URL: http://localhost:9000
  CIVICWATCH_STORAGE_ACCESS_KEY_ID: ci-minio-user
  CIVICWATCH_STORAGE_SECRET_ACCESS_KEY: ci-minio-password
  CIVICWATCH_TEST_EXTERNAL_STORAGE: "1"
  CIVICWATCH_TEST_STORAGE_ENFORCES_AUTH: "1"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: civicwatch
          POSTGRES_PASSWORD: civicwatch
          POSTGRES_DB: civicwatch_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U civicwatch" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=ci-minio-user -e MINIO_ROOT_PASSWORD=ci-minio-password \
            minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          for i in $(seq 1 30); do curl -sf http://localhost:9000/minio/health/ready && exit 0; sleep 1; done
          docker logs minio; exit 1
      - name: Create application database role
        env:
          PGPASSWORD: civicwatch
        run: psql -h localhost -U civicwatch -d civicwatch_test -c "CREATE ROLE civicwatch_app LOGIN PASSWORD 'civicwatch_app'" -c "CREATE ROLE civicwatch_worker LOGIN PASSWORD 'civicwatch_worker'"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - name: Migrations have no pending model changes
        run: alembic check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: civicwatch
          POSTGRES_PASSWORD: civicwatch
          POSTGRES_DB: civicwatch_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U civicwatch" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=ci-minio-user -e MINIO_ROOT_PASSWORD=ci-minio-password \
            minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          for i in $(seq 1 30); do curl -sf http://localhost:9000/minio/health/ready && exit 0; sleep 1; done
          docker logs minio; exit 1
      - name: Create application database role
        env:
          PGPASSWORD: civicwatch
        run: psql -h localhost -U civicwatch -d civicwatch_test -c "CREATE ROLE civicwatch_app LOGIN PASSWORD 'civicwatch_app'" -c "CREATE ROLE civicwatch_worker LOGIN PASSWORD 'civicwatch_worker'"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start API
        working-directory: backend
        env:
          # Plain HTTP on localhost, and many registrations from one IP across
          # six viewport projects. Production keeps the secure defaults.
          CIVICWATCH_SESSION_COOKIE_NAME: cw_session
          CIVICWATCH_SESSION_COOKIE_SECURE: "false"
          CIVICWATCH_REGISTRATIONS_PER_IP: "10000"
          CIVICWATCH_LOGIN_ATTEMPTS_PER_IP: "10000"
          CIVICWATCH_PUBLIC_READS_PER_IP: "100000"
        run: |
          pip install -e .
          alembic upgrade head
          python -c "from app.core.storage import get_storage; get_storage().ensure_bucket()"
          nohup uvicorn app.main:app --port 8000 > api.log 2>&1 &
      - name: Build web
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
      - name: Run Playwright
        working-directory: frontend
        env:
          # Tests appoint platform admins through the operator CLI.
          E2E_BACKEND_PYTHON: python
        run: npm run test:e2e
      - name: API log on failure
        if: failure()
        run: cat backend/api.log

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit Python runtime dependencies
        run: pip install pip-audit && pip-audit --requirement backend/requirements.lock --disable-pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit npm runtime dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the production API image
        run: docker build --target runtime -t civicwatch-api:ci backend
      - name: The production image contains no tests or test tools
        run: |
          docker run --rm civicwatch-api:ci sh -c '! test -d /app/tests && ! python -c "import pytest"'
      - name: Build the production web image
        run: docker build -t civicwatch-web:ci frontend
